name: proof
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get APK
        run: |
          curl -sL -o Pilot.apk "https://github.com/${{ github.repository }}/releases/download/latest/Pilot.apk"
          ls -l Pilot.apk
      - name: Write script
        run: |
          cat > proof.sh <<'SHEOF'
          set -x
          adb install -r Pilot.apk
          adb shell settings put secure enabled_accessibility_services app.pilot.agent/app.pilot.agent.AgentService
          adb shell settings put secure accessibility_enabled 1
          adb shell pm grant app.pilot.agent android.permission.RECORD_AUDIO || true
          sleep 3
          adb shell am start -n app.pilot.agent/.MainActivity
          sleep 5
          adb exec-out screencap -p > proof-1-home.png
          find_xy() {
            adb shell uiautomator dump /sdcard/u.xml >/dev/null
            adb pull /sdcard/u.xml u.xml >/dev/null
            python3 - "$1" <<'PY'
          import re,sys
          s=open('u.xml',encoding='utf-8').read()
          key=sys.argv[1]
          for n in re.findall(r'<node [^>]*>',s):
              d=re.search(r'content-desc="([^"]*)"',n)
              t=re.search(r'text="([^"]*)"',n)
              v=(d.group(1) if d else '')+'|'+(t.group(1) if t else '')
              if key in v:
                  b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n).groups()
                  print((int(b[0])+int(b[2]))//2,(int(b[1])+int(b[3]))//2)
                  break
          PY
          }
          XY=$(find_xy "Pilot island")
          cp u.xml proof-u1.xml
          if [ -z "$XY" ]; then
            SZ=$(adb shell wm size | tr -d '\r' | grep -oE '[0-9]+x[0-9]+' | head -1)
            W=${SZ%x*}; H=${SZ#*x}
            XY="$(( W / 2 )) $(( H * 111 / 1000 ))"
          fi
          echo "tapping island at: $XY"
          adb shell input tap $XY
          sleep 3
          adb exec-out screencap -p > proof-2-command-open.png
          XY2=$(find_xy "Type or speak a task")
          cp u.xml proof-u2.xml
          echo "command input found at: $XY2"
          adb shell input text /selftest
          sleep 1
          adb exec-out screencap -p > proof-3-typed.png
          XY3=$(find_xy "/selftest")
          echo "typed text found at: $XY3"
          adb shell input keyevent 66
          sleep 7
          adb exec-out screencap -p > proof-4-settings-opened-by-agent.png
          sleep 6
          adb exec-out screencap -p > proof-5-scrolled.png
          adb shell am start -n app.pilot.agent/.MainActivity
          sleep 3
          adb exec-out screencap -p > proof-6-app-log.png
          adb logcat -d > proof-logcat.txt || true
          ls -l proof-*.png
          SHEOF
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash proof.sh
      - name: Publish proof
        if: always()
        run: |
          gh release delete proof --repo ${{ github.repository }} --yes --cleanup-tag || true
          gh release create proof proof-*.png proof-u*.xml proof-logcat.txt --repo ${{ github.repository }} --title "proof" --notes "emulator run ${{ github.run_number }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
