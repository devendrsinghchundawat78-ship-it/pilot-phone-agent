name: 5-proof
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Get APK
        run: |
          curl -sL -o Pilot.apk "https://github.com/${{ github.repository }}/releases/download/latest/Pilot.apk"
          ls -l Pilot.apk
      - name: Write script
        run: |
          cat > proof.sh <<'SHEOF'
          set -x
          adb install -r Pilot.apk
          adb shell settings put secure enabled_accessibility_services app.pilot.agent/app.pilot.agent.AgentService
          adb shell settings put secure accessibility_enabled 1
          adb shell pm grant app.pilot.agent android.permission.RECORD_AUDIO || true
          sleep 3
          adb shell am start -n app.pilot.agent/.MainActivity
          sleep 5
          adb exec-out screencap -p > proof-1-home-charcoal.png
          adb shell am start -n app.pilot.agent/.MainActivity --ez open_settings true
          sleep 3
          adb exec-out screencap -p > proof-2-settings-themes.png
          SIZE=$(adb shell wm size | tr -d '\r' | grep -oE '[0-9]+x[0-9]+' | head -1)
          W=${SIZE%x*}
          H=${SIZE#*x}
          D=$(adb shell wm density | tr -d '\r' | grep -oE '[0-9]+' | tail -1)
          X=$((W / 2))
          YTHEME=$((180 * D / 160))
          YPILL=$((H * 111 / 1000))
          adb shell input tap $((W / 2)) $YTHEME
          sleep 2
          adb exec-out screencap -p > proof-3-theme-porcelain.png
          adb shell input keyevent 4
          sleep 2
          adb exec-out screencap -p > proof-4-home-porcelain.png
          adb shell input tap $X $YPILL
          sleep 2
          adb exec-out screencap -p > proof-5-island-porcelain.png
          adb shell input text /selftest
          sleep 1
          adb shell input keyevent 66
          sleep 8
          adb exec-out screencap -p > proof-6-agent-working.png
          sleep 1
          adb exec-out screencap -p > proof-6b-agent-working.png
          sleep 6
          adb shell am start -n app.pilot.agent/.MainActivity --ez open_settings true
          sleep 2
          adb shell input tap $((W * 5 / 6)) $YTHEME
          sleep 2
          adb exec-out screencap -p > proof-7-theme-glass.png
          adb shell am start -a android.settings.SETTINGS
          sleep 3
          adb shell input tap $X $YPILL
          sleep 3
          adb exec-out screencap -p > proof-8-island-glass.png
          adb shell am start -n app.pilot.agent/.HistoryActivity
          sleep 3
          adb exec-out screencap -p > proof-9-history.png
          adb shell input tap $X $((H * 232 / 1000))
          sleep 2
          adb exec-out screencap -p > proof-10-history-detail.png
          ls -l proof-*.png
          SHEOF
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash proof.sh
      - name: Publish proof
        if: always()
        run: |
          gh release delete proof --repo ${{ github.repository }} --yes --cleanup-tag || true
          gh release create proof proof-*.png --repo ${{ github.repository }} --title "proof" --notes "emulator run ${{ github.run_number }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
